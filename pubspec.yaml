name: local_connect
description: "تطبيق مراسلة يعمل أوفلاين على الشبكة المحلية وأونلاين عبر الإنترنت، بأرقام داخلية أو أرقام هاتف."
publish_to: 'none'
version: 0.18.2+37

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  open_filex: ^4.7.0
  record: ^6.1.0
  audioplayers: ^6.5.1
  flutter_contacts: ^1.1.9+2
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.1
  http: ^1.6.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.2
  flutter_webrtc: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  package_info_plus_platform_interface: ^3.2.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#E8F5E9"
  adaptive_icon_foreground: "assets/icon/icon.png"
